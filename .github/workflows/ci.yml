name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    # 原生模块（better-sqlite3 / uiohook-napi / ffi-rs）按 Windows 取 prebuilt，
    # 且应用本身仅 Windows，故 CI 与 build-release 一致用 windows runner。
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc, node + web)
        run: npm run typecheck

      - name: Unit tests (vitest)
        # npm ci 后 better-sqlite3 为 node ABI，vitest 直接可跑，无需 rebuild。
        run: npm test

      - name: Build smoke (electron-vite)
        # 验证 copy:ort + 三套入口能完整构建（不打包安装器，故无需 electron-rebuild）。
        run: npm run build
