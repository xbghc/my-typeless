name: Build & Release

on:
  push:
    tags:
      - "v*" # 推送 v1.0.0 格式的 tag 时触发
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true

permissions:
  contents: write # 需要创建 Release

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # x64 runner
            arch: x64
          - os: windows-11-arm # arm64 runner
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (${{ matrix.arch }})"

      - name: Set version in package.json
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Build (electron-vite)
        run: npm run build

      - name: Package & publish (electron-builder)
        run: npx electron-builder --win --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
